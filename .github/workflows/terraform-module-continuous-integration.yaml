# Terraform Module — Continuous Integration
#
# Reusable workflow for all Terraform modules. Called by each module's ci.yml.
#
# Steps:
#   1. Detects minimum Terraform version from versions.tf (uses the lowest allowed)
#   2. Auto-formats code with `terraform fmt -recursive`
#      - If changes are needed, commits the fix and stops (saves CI minutes)
#   3. Validates syntax with `terraform init` + `terraform validate`
#   4. Lints with tflint using shared config from .github/terraform/tflint.hcl
#   5. Security-scans with tfsec using shared config from .github/terraform/tfsec.yml
#      - Uploads findings to the GitHub Security tab (SARIF)
#      - Fails the build on HIGH/CRITICAL findings (MEDIUM/LOW are advisory)
#
# Overrides:
#   - Place a .tflint.hcl in your module repo root to use custom lint rules
#   - Place a .tfsec/config.yml in your module repo root to use custom tfsec config
#   - The shared configs are only downloaded if no local equivalent exists
name: 'Continuous Integration'

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Agent selection string.'
        required: false
        default: 'ubuntu-latest'
        type: string

permissions:
  id-token: write
  issues: write
  pull-requests: write
  contents: write
  security-events: write

jobs:
  continuous-integration:
    name: 'Continuous Integration'
    runs-on: ${{ inputs.runs-on }}
    env:
      TF_IN_AUTOMATION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Detect minimum Terraform version
        id: tf-version
        run: |
          version=$(grep -h required_version *.tf | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Using Terraform $version (minimum from versions.tf)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      - name: Terraform Format
        run: terraform fmt -recursive

      - name: Commit formatting fixes
        id: fmt-commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: terraform format"
          file_pattern: "*.tf"
          commit_user_name: "fmt-bot"
          commit_user_email: "actions@github.com"
          commit_author: "fmt-bot <actions@github.com>"

      - name: Stop if formatting was applied
        if: steps.fmt-commit.outputs.changes_detected == 'true'
        run: |
          echo "::notice::Formatting fixes committed. CI will re-run on the new commit."
          exit 1

      - name: Check Terraform Syntax
        run: terraform init -backend=false && terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Fetch shared tflint config
        if: hashFiles('.tflint.hcl') == ''
        run: curl -sL https://raw.githubusercontent.com/lsdopen/.github/main/.github/terraform/tflint.hcl -o .tflint.hcl

      - name: Check Terraform Lint
        run: tflint --init && tflint -f compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Security scanning with tfsec. Uses a module-local .tfsec/config.yml when
      # present, otherwise the shared org default. Findings are uploaded to the
      # GitHub Security tab as SARIF, and HIGH/CRITICAL findings fail the build.
      - name: Fetch shared tfsec config
        if: hashFiles('.tfsec/config.yml') == ''
        run: |
          mkdir -p .tfsec
          curl -sL https://raw.githubusercontent.com/lsdopen/.github/main/.github/terraform/tfsec.yml -o .tfsec/config.yml

      - name: TFSec Security Scan (SARIF)
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        if: always()
        with:
          config_file: .tfsec/config.yml
          sarif_file: tfsec.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec.sarif

      - name: TFSec Gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          config_file: .tfsec/config.yml
          # Only HIGH and CRITICAL findings block the build; MEDIUM/LOW are
          # visible in the Security tab but advisory.
          additional_args: --minimum-severity HIGH
