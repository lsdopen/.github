# Shared tfsec configuration for LSD Open Terraform modules.
#
# This is the org default, fetched by terraform-module-continuous-integration.yaml
# only when a module has no local .tfsec/config.yml. Modules with module-specific
# needs (extra excludes, different severity floor) should commit their own
# .tfsec/config.yml, which takes precedence.
#
# The reusable CI workflow fails the build on HIGH/CRITICAL findings; MEDIUM and
# LOW findings are reported to the GitHub Security tab but do not block.

# Minimum severity level to report in output.
severity: MEDIUM

# Include passed checks for comprehensive Security-tab reporting.
include_passed: true

# Org-wide exclusions. Record real false positives here with the rule id and a
# one-line reason; keep this list short and justified.
exclude: []

scan:
  include_patterns:
    - "*.tf"
    - "**/*.tf"
    - "examples/**/*.tf"

  exclude_patterns:
    - ".terraform/**"
    - "*.tfstate*"
    - ".terraform.lock.hcl"

reporting:
  detailed: true
  include_remediation: true
